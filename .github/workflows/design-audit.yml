name: Design audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'DESIGN.md'
      - 'PRODUCT.md'
      - '.impeccable/**'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'DESIGN.md'
      - 'PRODUCT.md'
      - '.impeccable/**'

jobs:
  design-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Impeccable audit
        run: npm run design:audit
